name: AlgoLens CI

# Runs the backend and frontend test/build gates on every PR and on pushes to main.
# deploy.yml calls this as its quality job (workflow_call), so a red build here
# blocks the production deploy.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    # A throwaway Postgres for the opt-in integration tests (they drop and
    # rebuild the trading schema, and refuse any host but localhost).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ALGOLENS_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: algolens-api/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r algolens-api/requirements-dev.txt

      - name: Verify the vendored protos match trade-ngin at the pinned commit
        # proto/algogators/*.proto and scripts/gen_versions.py must be
        # byte-identical to AlgoGators/trade-ngin at the commit recorded in
        # proto/algogators/SOURCE.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: sh algolens-api/scripts/sync_protos.sh --check

      - name: Verify the gRPC stubs and API versions match the vendored protos
        # The committed algogators/*_pb2*.py must be exactly what grpcio-tools
        # generates, and algogators/versions.py exactly what the "Version:"
        # header of each .proto says (the constant the client sends).
        run: |
          cd algolens-api
          sh scripts/gen_proto.sh
          if [ -n "$(git status --porcelain -- algogators proto)" ]; then
            git status --porcelain -- algogators proto
            git diff -- algogators
            echo "::error::algogators/ stubs or versions.py are stale: run algolens-api/scripts/gen_proto.sh and commit"
            exit 1
          fi

      - name: Run backend tests
        # The suites are designed to run without a database (fail-closed guards run
        # in subprocesses; the registry/service tests stub the DB). The guard keeps
        # this green until the test-bearing PRs land, then it enforces automatically.
        run: |
          if [ -d algolens-api/tests ]; then
            cd algolens-api && python -m pytest tests -q
          else
            echo "::warning::algolens-api/tests not present yet — merge the test PRs to enable this gate"
          fi

  frontend:
    name: Frontend (build + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: algolens-frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: algolens-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
