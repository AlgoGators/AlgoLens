name: AlgoLens CI

# Runs the backend and frontend test/build gates on every PR and on pushes to main.
# The Deploy workflow is chained to this via workflow_run, so a red build here
# blocks the production deploy.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    # The unit suite runs without a database, but it was 120+ green while the
    # position write path was broken against Postgres in three separate ways --
    # every one of them living in the gap between a Python float and a NUMERIC
    # column. tests/integration runs the real write against this service.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: algolens
          POSTGRES_PASSWORD: algolens
          POSTGRES_DB: algolens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: algolens-api/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r algolens-api/requirements.txt
          pip install pytest

      - name: Run backend tests
        # The suites are designed to run without a database (fail-closed guards run
        # in subprocesses; the registry/service tests stub the DB). The guard keeps
        # this green until the test-bearing PRs land, then it enforces automatically.
        #
        # ALGOLENS_TEST_DB switches tests/integration on. Without it those tests
        # skip, which is what makes them safe to run locally -- but it also means
        # a missing service here silently drops the only coverage of the write
        # path, so the step after this one fails if they did not run.
        env:
          ALGOLENS_TEST_DB: postgresql://algolens:algolens@localhost:5432/algolens_test
        run: |
          if [ -d algolens-api/tests ]; then
            cd algolens-api && python -m pytest tests -q --junitxml=../pytest-report.xml
          else
            echo "::warning::algolens-api/tests not present yet — merge the test PRs to enable this gate"
          fi

      - name: Confirm the integration tests actually ran
        if: hashFiles('pytest-report.xml') != ''
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse("pytest-report.xml").getroot()
          cases = [c for c in root.iter("testcase")
                   if "integration" in (c.get("classname") or "")]
          ran = [c for c in cases if c.find("skipped") is None]
          if not ran:
              sys.exit("No integration tests ran. The Postgres service or "
                       "ALGOLENS_TEST_DB is misconfigured, and the write path "
                       "is currently untested.")
          print(f"{len(ran)} integration tests ran against Postgres")
          PY

  frontend:
    name: Frontend (build + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: algolens-frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: algolens-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Runs before the build on purpose: `vite build` strips types without
      # checking them, so a type error ships green. This gate is the only thing
      # that reads them.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
