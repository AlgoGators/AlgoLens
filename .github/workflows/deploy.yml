name: Deploy AlgoLens

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Validate SSH key and connectivity
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > /tmp/test_key
          chmod 600 /tmp/test_key
          echo "--- Key header/footer ---"
          head -1 /tmp/test_key
          tail -1 /tmp/test_key
          echo "--- Line count ---"
          wc -l /tmp/test_key
          echo "--- ssh-keygen validation ---"
          ssh-keygen -l -f /tmp/test_key || echo "INVALID KEY FORMAT"
          echo "--- TCP connectivity to port 22 ---"
          nc -zv ${{ secrets.EC2_HOST }} 22 2>&1 || echo "PORT 22 UNREACHABLE"
          echo "--- Verbose SSH handshake ---"
          ssh -vvv -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=10 \
            -i /tmp/test_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} echo "AUTH OK" 2>&1 || true
          rm /tmp/test_key

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd /home/ec2-user/AlgoLens

            echo "Pulling latest code..."
            git pull origin main

            echo "Installing frontend dependencies..."
            npm ci

            echo "Building frontend..."
            npm run build

            echo "Installing backend dependencies..."
            pip3 install -r backend/requirements.txt --quiet

            echo "Restarting services..."
            sudo systemctl restart algolens-backend
            sudo systemctl restart algolens

            echo "Deployment complete!"
            echo "Site: https://algolens.algogators.com"
