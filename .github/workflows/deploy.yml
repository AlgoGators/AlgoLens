name: Deploy AlgoLens

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd /home/ec2-user/AlgoLens

            echo "Pulling latest code..."
            git pull origin main

            echo "Creating backend .env file from secrets..."
            cat > backend/.env << EOF
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=${{ secrets.DB_NAME }}
            JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
            EOF

            echo "Installing frontend dependencies..."
            npm ci

            echo "Building frontend..."
            npm run build

            echo "Installing backend dependencies..."
            cd backend
            pip3 install -r requirements.txt
            cd ..

            echo "Configuring systemd services..."

            # Create/update backend service
            sudo tee /etc/systemd/system/algolens-backend.service > /dev/null << 'BACKEND_EOF'
            [Unit]
            Description=AlgoLens Backend API
            After=network.target

            [Service]
            Type=simple
            User=ec2-user
            WorkingDirectory=/home/ec2-user/AlgoLens/backend
            ExecStart=/usr/bin/python3 /home/ec2-user/AlgoLens/backend/app.py
            Restart=always
            RestartSec=10

            [Install]
            WantedBy=multi-user.target
            BACKEND_EOF

            # Create/update frontend service (externally accessible on 0.0.0.0)
            sudo tee /etc/systemd/system/algolens.service > /dev/null << 'FRONTEND_EOF'
            [Unit]
            Description=AlgoLens Frontend
            After=network.target

            [Service]
            Type=simple
            User=ec2-user
            WorkingDirectory=/home/ec2-user/AlgoLens
            ExecStart=/usr/bin/npx serve -s build -l tcp://0.0.0.0:3000
            Restart=always
            RestartSec=10

            [Install]
            WantedBy=multi-user.target
            FRONTEND_EOF

            echo "Enabling and restarting services..."
            sudo systemctl daemon-reload
            sudo systemctl enable algolens-backend
            sudo systemctl enable algolens
            sudo systemctl restart algolens-backend
            sudo systemctl restart algolens

            echo "Deployment complete!"
            echo "Frontend: http://${{ secrets.EC2_HOST }}:3000"
            echo "Backend: http://${{ secrets.EC2_HOST }}:5000"
