name: Deploy AlgoLens

# Gated on CI: this runs only after the "AlgoLens CI" workflow completes
# successfully on main, so a failing test/build never reaches production.
# workflow_dispatch is kept for manual, on-demand deploys.
on:
  workflow_run:
    workflows: ["AlgoLens CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    # Deploy on a green CI run, or when manually triggered.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e

            cd /home/ec2-user/AlgoLens

            echo "Pulling latest code..."
            git pull origin main

            echo "Installing frontend dependencies..."
            npm ci

            echo "Building frontend..."
            npm run build

            echo "Installing backend dependencies..."
            pip3 install -r backend/requirements.txt --quiet

            echo "Updating service and nginx config..."
            sudo cp deployment/algolens-backend.service /etc/systemd/system/
            sudo cp deployment/algolens.service /etc/systemd/system/
            sudo cp deployment/algolens.conf /etc/nginx/conf.d/algolens.conf
            sudo systemctl daemon-reload
            sudo nginx -t
            sudo systemctl reload nginx

            echo "Restarting services..."
            sudo systemctl restart algolens-backend
            sudo systemctl restart algolens

            echo "Deployment complete!"
            echo "Site: https://algolens.algogators.com"
