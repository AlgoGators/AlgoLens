name: Deploy AlgoLens

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          echo "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=15 \
            -i /tmp/deploy_key $EC2_USER@$EC2_HOST << 'ENDSSH'
            set -e

            cd /home/ec2-user/AlgoLens

            echo "Pulling latest code..."
            git pull origin main

            echo "Installing frontend dependencies..."
            npm ci

            echo "Building frontend..."
            npm run build

            echo "Installing backend dependencies..."
            pip3 install -r backend/requirements.txt --quiet

            echo "Restarting services..."
            sudo systemctl restart algolens-backend
            sudo systemctl restart algolens

            echo "Deployment complete!"
          ENDSSH

          rm /tmp/deploy_key
