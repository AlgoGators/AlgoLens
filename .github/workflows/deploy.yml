name: Deploy AlgoLens

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd /home/ec2-user/AlgoLens

            echo "Pulling latest code..."
            git pull origin main

            echo "Creating backend .env file from secrets..."
            cat > backend/.env << EOF
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=${{ secrets.DB_NAME }}
            JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
            FLASK_ENV=production
            FLASK_DEBUG=False
            PORT=5000
            CORS_ORIGINS=https://algolens.algogators.com,http://localhost:5173,http://localhost:3000
            EOF

            echo "Creating frontend .env file..."
            cat > .env << EOF
            VITE_API_URL=https://algolens.algogators.com
            EOF

            echo "Installing frontend dependencies..."
            npm ci

            echo "Building frontend..."
            npm run build

            echo "Installing backend dependencies..."
            cd backend
            pip3 install -r requirements.txt
            cd ..

            echo "Configuring systemd services..."

            # Create/update backend service
            sudo tee /etc/systemd/system/algolens-backend.service > /dev/null << 'BACKEND_EOF'
            [Unit]
            Description=AlgoLens Backend API
            After=network.target

            [Service]
            Type=simple
            User=ec2-user
            WorkingDirectory=/home/ec2-user/AlgoLens/backend
            ExecStart=/usr/bin/python3 /home/ec2-user/AlgoLens/backend/app.py
            Restart=always
            RestartSec=10

            [Install]
            WantedBy=multi-user.target
            BACKEND_EOF

            # Create/update frontend service (localhost only, proxied by Nginx)
            sudo tee /etc/systemd/system/algolens.service > /dev/null << 'FRONTEND_EOF'
            [Unit]
            Description=AlgoLens Frontend
            After=network.target

            [Service]
            Type=simple
            User=ec2-user
            WorkingDirectory=/home/ec2-user/AlgoLens
            ExecStart=/usr/bin/npx serve -s build -l tcp://127.0.0.1:3000
            Restart=always
            RestartSec=10

            [Install]
            WantedBy=multi-user.target
            FRONTEND_EOF

            echo "Installing Nginx if not present..."
            sudo yum install -y nginx

            echo "Configuring Nginx..."
            sudo cp nginx.conf /etc/nginx/conf.d/algolens.conf

            echo "Testing Nginx configuration..."
            sudo nginx -t

            echo "Enabling and restarting services..."
            sudo systemctl daemon-reload
            sudo systemctl enable algolens-backend
            sudo systemctl enable algolens
            sudo systemctl enable nginx
            sudo systemctl restart algolens-backend
            sudo systemctl restart algolens

            # Only restart nginx if config is valid
            if sudo nginx -t 2>/dev/null; then
                sudo systemctl restart nginx
            fi

            echo "Deployment complete!"
            echo "Frontend: https://algolens.algogators.com"
            echo "Backend: http://localhost:5000"
