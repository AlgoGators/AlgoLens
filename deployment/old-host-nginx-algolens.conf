# Replacement server block for the OLD host (ec2-user, Amazon Linux), installed
# as /etc/nginx/conf.d/algolens.conf. It keeps TLS here and forwards every
# request for algolens.algogators.com to the edge container on the trade-ngin
# host, which routes / to the frontend and /auth, /portfolio, /health to the
# backend.
#
# 172.31.23.190 is the trade-ngin box's private IP (the same box airflow is
# proxied to on :8080). Install, then: sudo nginx -t && sudo systemctl reload nginx
#
# Rollback: restore the previous algolens.conf (/ -> localhost:3000,
# /auth and /portfolio -> localhost:5001) and reload nginx.

server {
    listen 80;
    server_name algolens.algogators.com;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name algolens.algogators.com;

    # SSL certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/algolens.algogators.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/algolens.algogators.com/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 10m;

    location / {
        proxy_pass http://172.31.23.190:8088;
        proxy_http_version 1.1;

        # Websocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }
}
