# Routes shared by the edge's server blocks (edge.conf). Mounted as
# /etc/nginx/snippets/edge-routes.conf and included inside each `server`.
# The including server sets $fwd_for and $fwd_proto: client-supplied headers
# are trusted only on the legacy :8088 listener, whose sole client is the old
# host's nginx.

# Investor report uploads are capped at 10 MB by the backend; 11m leaves room
# for the multipart overhead.
client_max_body_size 11m;

# Docker's embedded DNS, so restarted containers are re-resolved.
resolver 127.0.0.11 valid=10s ipv6=off;

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $fwd_for;
proxy_set_header X-Forwarded-For   $fwd_for;
proxy_set_header X-Forwarded-Proto $fwd_proto;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $edge_connection;
proxy_connect_timeout 5s;
proxy_read_timeout 120s;

# Liveness of the edge itself (no upstream involved).
location = /edge-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# Backend (Flask, gunicorn on :5000). These are every path the frontend
# calls: the /auth/*, /portfolio/* and /api/* blueprints and the /health check.
location = /health {
    set $backend http://backend:5000;
    proxy_pass $backend;
}

location /auth/ {
    limit_req zone=edge_auth burst=20 nodelay;
    set $backend http://backend:5000;
    proxy_pass $backend;
}

location /portfolio/ {
    set $backend http://backend:5000;
    proxy_pass $backend;
}

location /api/ {
    set $backend http://backend:5000;
    proxy_pass $backend;
}

# Everything else is the static frontend (nginx in the frontend image).
# The frontend image has no SPA fallback, so a 404 there (e.g. a reload on
# /login) is answered with index.html instead.
location / {
    set $frontend http://frontend:80;
    proxy_pass $frontend;
    proxy_intercept_errors on;
    error_page 404 = @spa;
}

location @spa {
    set $frontend http://frontend:80;
    proxy_pass $frontend/index.html;
}
