# Production AlgoLens stack on the trade-ngin box (ubuntu@ec2-18-118-225-224,
# private IP 172.31.23.190), next to trade-ngin and the data-ngin Airflow stack.
#
# Nothing is built here. deploy.sh exports BACKEND_IMAGE and FRONTEND_IMAGE
# (ghcr.io/...@sha256:...), the digests CI built and pushed, and this file only
# pulls and runs them.
#
# Secrets come from ALGOLENS_ENV_FILE, which lives OUTSIDE the checkout
# (default /home/ubuntu/.config/algogators/algolens.env) so a `git pull` can
# never touch it. Variable names: deployment/algolens.env.example.
#
# Memory: the box has 1 vCPU and ~1 GiB RAM, and trade-ngin's 09:30 live run
# must never be OOM-killed. Every container here has a hard memory limit and
# oom_score_adj 800, so under pressure the kernel kills AlgoLens first.
#
# Only `edge` publishes a port (8088). The security group allows 8088 only from
# the old host, whose nginx terminates TLS for algolens.algogators.com.
#
# Logs: every service uses json-file capped at 3 x 10 MB, set here per service
# (the Docker daemon config is shared with the live trading engine and is not
# touched).
name: algolens

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is unset -- deploy.sh sets it to the CI-built digest}
    container_name: algolens-backend
    restart: unless-stopped
    env_file:
      - ${ALGOLENS_ENV_FILE:?ALGOLENS_ENV_FILE is unset}
    # The image default is 2 workers x 4 threads; keep 2 small workers so one
    # slow request does not block the rest, under a 256m cap. Flask-Limiter's
    # in-memory counters are per worker.
    command:
      - gunicorn
      - --bind=0.0.0.0:5000
      - --workers=2
      - --threads=2
      - --timeout=60
      - --max-requests=1000
      - --max-requests-jitter=100
      - wsgi:app
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    oom_score_adj: 800
    logging: *logging
    volumes:
      - backend-logs:/app/logs
    # Liveness (no database): a database outage must not mark the backend
    # unhealthy. deploy.sh gates on readiness, /health, through the edge.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://localhost:5000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      default:
      # Shared with the trade-ngin desk-agent (gRPC, later). deploy.sh creates
      # it with `docker network create qt` if it does not exist.
      qt:
        aliases:
          - algolens-backend

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is unset -- deploy.sh sets it to the CI-built digest}
    container_name: algolens-frontend
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.25
    oom_score_adj: 800
    logging: *logging
    networks:
      - default

  edge:
    image: nginx:1.27-alpine
    container_name: algolens-edge
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "0.0.0.0:8088:80"
    volumes:
      - ./edge.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 32m
    memswap_limit: 32m
    cpus: 0.25
    oom_score_adj: 800
    logging: *logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/edge-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - default

networks:
  default: {}
  qt:
    external: true

volumes:
  backend-logs:
