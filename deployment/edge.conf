# Edge router for AlgoLens on the trade-ngin box. Mounted into the `edge`
# container as /etc/nginx/conf.d/default.conf and published on host port 8088.
#
# Upstream of this is the old host's nginx, which terminates TLS and already
# sets X-Forwarded-For / X-Forwarded-Proto. Port 8088 is reachable only from
# that host (security group), so its forwarded headers are passed through
# unchanged. Appending here would make Flask's ProxyFix(x_for=1) see the old
# host's IP instead of the client and collapse the per-IP rate limits.

map $http_x_forwarded_for $edge_xff {
    ""      $remote_addr;
    default $http_x_forwarded_for;
}

map $http_x_forwarded_proto $edge_xfp {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

map $http_upgrade $edge_connection {
    ""      "";
    default upgrade;
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 10m;

    # Docker's embedded DNS, so restarted containers are re-resolved.
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $edge_xff;
    proxy_set_header X-Forwarded-For   $edge_xff;
    proxy_set_header X-Forwarded-Proto $edge_xfp;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $edge_connection;

    # Liveness of the edge itself (no upstream involved).
    location = /edge-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Backend (Flask, gunicorn on :5000). These are every path the frontend
    # calls: /auth/* and /portfolio/* blueprints and the /health check.
    location = /health {
        set $backend http://backend:5000;
        proxy_pass $backend;
    }

    location /auth/ {
        set $backend http://backend:5000;
        proxy_pass $backend;
    }

    location /portfolio/ {
        set $backend http://backend:5000;
        proxy_pass $backend;
    }

    # Everything else is the static frontend (nginx in the frontend image).
    # The frontend image has no SPA fallback, so a 404 there (e.g. a reload on
    # /login) is answered with index.html instead.
    location / {
        set $frontend http://frontend:80;
        proxy_pass $frontend;
        proxy_intercept_errors on;
        error_page 404 = @spa;
    }

    location @spa {
        set $frontend http://frontend:80;
        proxy_pass $frontend/index.html;
    }
}
