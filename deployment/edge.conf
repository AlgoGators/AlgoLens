# Edge router for AlgoLens on the trade-ngin box. Mounted into the `edge`
# container as /etc/nginx/conf.d/default.conf; the routes themselves are in
# edge-routes.conf.
#
# Listeners (container port -> host port):
#   443  -> 443   TLS for algolens.algogators.com (DNS points at this box).
#                 The certificate is Let's Encrypt, in the host's
#                 /etc/letsencrypt (see DEPLOYMENT.md, "TLS").
#   80   -> 80    ACME HTTP-01 challenges (certbot --webroot) and a redirect
#                 of everything else to HTTPS.
#   8088 -> 8088  Legacy plain HTTP for the old host's nginx and for deploy.sh's
#                 health check. It trusts the X-Forwarded-* headers it
#                 receives, so the security group must allow 8088 only from
#                 the old host. On 80 and 443 the client is direct, and the
#                 headers are set from the connection instead, so Flask's
#                 ProxyFix(x_for=1) sees the real client IP and a client
#                 cannot spoof it to dodge the per-IP rate limits.

map $http_x_forwarded_for $legacy_xff {
    ""      $remote_addr;
    default $http_x_forwarded_for;
}

map $http_x_forwarded_proto $legacy_xfp {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

map $http_upgrade $edge_connection {
    ""      "";
    default upgrade;
}

# Login and registration bursts per client IP (the backend has its own
# per-IP limits too).
limit_req_zone $binary_remote_addr zone=edge_auth:5m rate=5r/s;
limit_req_status 429;

server_tokens off;

# Legacy :8088, plain HTTP (old host proxy, health checks).
server {
    listen 8088 default_server;
    server_name _;

    set $fwd_for   $legacy_xff;
    set $fwd_proto $legacy_xfp;

    include /etc/nginx/snippets/edge-routes.conf;
}

# Public :80: ACME challenges, otherwise redirect to HTTPS.
server {
    listen 80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location = /edge-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://algolens.algogators.com$request_uri;
    }
}

# Public :443, TLS.
server {
    listen 443 ssl default_server;
    http2 on;
    server_name algolens.algogators.com;

    ssl_certificate     /etc/letsencrypt/live/algolens.algogators.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/algolens.algogators.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:5m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    set $fwd_for   $remote_addr;
    set $fwd_proto https;

    include /etc/nginx/snippets/edge-routes.conf;
}
