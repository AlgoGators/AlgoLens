# The simulator's edge: deployment/edge.conf's legacy listener, on plain HTTP, with the same
# routes (deployment/edge-routes.conf is mounted from the checkout).
map $http_upgrade $edge_connection {
    ""      "";
    default upgrade;
}

limit_req_zone $binary_remote_addr zone=edge_auth:5m rate=5r/s;
limit_req_status 429;
server_tokens off;

server {
    listen 80 default_server;
    server_name _;

    set $fwd_for   $remote_addr;
    set $fwd_proto http;

    include /etc/nginx/snippets/edge-routes.conf;
}
