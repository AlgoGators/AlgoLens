services:
  frontend:
    image: ghcr.io/algogators/algolens-frontend:latest
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: ghcr.io/algogators/algolens-backend:latest
    ports:
      - "127.0.0.1:5000:5000"
    env_file:
      - .env
    volumes:
      - backend-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  backend-logs:
